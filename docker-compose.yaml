services:
  db:
    image: mysql:8.4
    container_name: ITSeminar_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: itSeminardb
      MYSQL_PASSWORD: password
      MYSQL_USER: user
    ports:
      - "3308:3306"
    volumes:
      - ./data:/var/lib/mysql
      

